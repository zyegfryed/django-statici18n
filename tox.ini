[tox]
envlist =
    py{310,311,312,313,314}-django52,
    py{312,313,314}-django60,
    py{312,313,314}-django61,
    coverage

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
passenv =
    CI
setenv =
    PYTHONPATH={toxinidir}/tests/test_project
    DJANGO_SETTINGS_MODULE=project.settings
commands = pytest -q tests
deps =
    pytest
    pytest-django
    django52: Django>=5.2,<6
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2

[testenv:coverage]
basepython = python3.12
commands =
    pytest -q --cov=statici18n --cov-report=xml tests
deps =
    Django>=5.2,<6.2
    pytest
    pytest-cov
    pytest-django
